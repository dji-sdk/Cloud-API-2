# DJI FlightHub PaaS SDK 错误码字典（唯一真值源）
# 由原 cloudapi2-troubleshooting 错误码字典（frontend + backend + 设备侧码）
#   + cloudapi2-diagnosis/dicts/error-codes.yaml（6 条 backend，与 troubleshooting 相同）
# 合并收敛而来。任何错误码的增删改都改本文件，不再维护多份。
# diag.sh 的 classify_code case 由本文件 codes 集合派生（grep 校验一致）。
# 前端（paas.js / FH2 组件）和后端（Java SDK）错误码统一索引
#
# 本文件含四套体系，互不通用，查码前先确认来源：
#   frontend           — paas.js / FH2 组件，4001-7000
#   backend            — Java SDK，ERROR_* / NPE
#   platform_response  — 平台 HTTP API 响应，2XXYYYY（本文件 platform_* 段）
#   312xxx-514xxx      — 设备端 6 位码

# ==============================================================================
# 平台 HTTP 响应错误码（2XXYYYY）
# ==============================================================================
# 解构规则与完整排查流程见 references/platform-error-response.md
#
# 关键：外层 code 不一定是业务码。message 含 ". err_code: " 时为双错误码模式，
#       必须先取内层 err_code 定位业务问题，再看外层 code 理解调用链。
#       ServiceError 场景 HTTP status 仍为 200 —— 不能凭 HTTP 200 判定成功。
# ==============================================================================

platform_error_domains:
  "200": 通用管理框架（非业务域，需解构内层 err_code）
  "210": 管理服务 ManageService
  "211": 地图服务 MapService
  "212": 设备接入服务 ThingAccessService
  "213": 直播服务 LiveViewService
  "214": 航线服务 WaylineService
  "215": 飞行安全服务 FlySafeService
  "216": 飞行控制模块 FlyControlService
  "217": 文件管理模块 FileStorageService
  "218": 实时建图模块 ReconstructionService
  "219": 计划库 TaskManageService
  "220": 机场日志 AirportLogService

platform_response:
  - code: 200400
    name: CodeFailure
    layer: platform
    cause: 通用失败 — 平台返回的兜底码，本身不携带任何业务语义
    fix: |
      1. 该码信息量为零，不要据此判断业务原因
      2. 从 message 中解构内层 err_code（格式 "<Msg>. err_code: <码>"）
      3. 内层码前 3 位查 platform_error_domains 定位归属域
      4. message 无内层码时，带完整响应体 + request_id 报 DJI
    related_constraints:
      - error-code-check

  - code: 200401
    name: CodeInvalidToken
    layer: platform
    cause: Token 无效或已过期
    fix: |
      1. 刷新 token 后重试
      2. 确认 auth 回调每次返回最新 token（不可闭包捕获旧值）
    related_constraints:
      - auth-token-freshness

  - code: 200403
    name: CodePermissionDenied
    layer: platform
    cause: 权限不足 — 账号对该 workspace 或设备无操作权限
    fix: |
      1. 确认设备归属的 workspace 与当前账号一致
      2. 确认账号角色具备该接口所需权限

  - code: 200404
    name: CodeRecordNotFound
    layer: platform
    cause: 记录不存在 — SN / uuid 错误，或对象已被删除
    fix: |
      1. 用 fh_device_list / fh_workspace(list) 核对 SN 与 uuid
      2. 确认对象未在其他流程中被删除

  - code: 200610
    name: CodeInvalidOrBlankParam
    layer: platform
    cause: 参数无效或为空
    fix: |
      1. 比对接口文档确认必填参数齐全
      2. 检查参数类型与取值范围（尤其是高度、半径等数值边界）

  - code: 200612
    name: CodeRpcFailure
    layer: platform
    cause: 平台内部服务间调用失败 — 这是**包装码**，本身不说明业务问题
    fix: |
      1. 从 message 中解构内层 err_code（格式 "<Msg>. err_code: <码>"）
      2. 用内层 err_code 的前 3 位查 platform_error_domains 定位归属域
      3. message 无 err_code 时，带完整响应体 + request_id 报 DJI
    related_constraints:
      - error-code-check

  - code: 200613
    name: CodeErrorSign
    layer: platform
    cause: 签名错误
    fix: |
      1. 检查签名算法与密钥配置
      2. 确认请求时间戳未超出容差窗口

  - code: 200614
    name: CodeBindError
    layer: platform
    cause: 绑定错误 — 设备与机场/工作空间的绑定关系异常
    fix: |
      1. 核对设备 SN 是否已绑定到当前 workspace
      2. 检查无人机与机场的从属绑定关系是否完整
      3. 在平台侧重新绑定后重试

  - code: 212015
    name: ThingOffline / device_offline
    layer: platform
    cause: 设备离线 — 设备接入服务（ThingAccessService）查不到该 SN 的在线会话，直播/DRC/远程控制类指令下发失败
    fix: |
      1. 先分清是哪一侧离线：机库/地面站指令正常、**只有飞机 SN** 报 212015 → 几乎一定是飞机侧网络接入问题，不要改应用代码
      2. 查 MQTT 会话是否存在：docker exec <mqtt-broker> <broker-cli> clients list | grep <设备SN>
         - 无该 SN 记录 → 设备从未连上 MQTT Broker，按「上云方式 / 底座 .env 对外地址」排查
         - 有记录但 username/clientid 前缀不符 → 上云方式错误，需升行服 APP 0.0.90+ 后用上云 API2 重新扫码
      3. 私有化环境注意：setuptools update / 设备状态服务重启后所有机场/地面站会被置离线，需重新上报拓扑
      4. 日志出现 timestamp: 0 是私有化 MQTT Broker 4.x webhook 插件的正常现象，不是根因，不要据此查时间同步
      5. 完整六步排查（固件 → 上云方式 → DRTC/底座 .env → 端口 → 历史案例）见
         references/live-stream-device-troubleshooting.md
    related_constraints:
      - error-code-check

  - code: 213020
    name: PublishCheckErr / device_not_open
    layer: platform
    cause: 设备未推流 — 调用了依赖直播流的接口，但直播尚未开启
    fix: |
      1. 先调 fh_live_start 启动直播，确认返回成功
      2. 再调用录制等依赖直播流的接口
      3. 注意 fh_media_record 录的是直播流，不是机载 SD 卡

  - code: 213022
    name: ErrRecordTaskStarted
    layer: platform
    cause: 录制任务已启动 — 重复发起录制
    fix: |
      1. 发起录制前先查当前录制状态
      2. 客户端做幂等保护，避免重复点击/重试导致重复下发

# ==============================================================================

frontend:
  - code: 4001
    name: WS_AUTH_ERROR
    layer: websocket
    cause: WebSocket 鉴权失败 — token 过期、格式错误、或 auth.headers 回调返回空值
    fix: |
      1. 确认 auth.headers 回调每次返回最新 token（不可闭包捕获旧值）
      2. 检查 token 有效期，必要时刷新
      3. 确认 wssHost 地址正确且可达
    related_constraints:
      - auth-token-freshness

  - code: 4002
    name: WS_CONNECT_ERROR
    layer: websocket
    cause: WebSocket 连接失败 — 地址不可达、端口错误、或协议不匹配
    fix: |
      1. 确认 wssHost 地址和端口正确（默认 30812）
      2. 确认协议一致（HTTPS 页面用 wss://，HTTP 页面用 ws://）
      3. 检查防火墙/代理是否阻断 WebSocket
    related_constraints:
      - protocol-consistency

  - code: 5000
    name: API_REQUEST_ERROR
    layer: http
    cause: HTTP API 请求失败 — serverHost 不可达、CORS 阻断、或接口返回非 200
    fix: |
      1. 确认 serverHost 地址和端口正确
      2. 浏览器控制台检查是否有 CORS 错误
      3. 检查网络请求的响应状态码和 body
    related_constraints:
      - protocol-consistency

  - code: 5001
    name: API_PARAM_ERROR
    layer: http
    cause: API 参数错误 — 必填字段缺失或格式不正确
    fix: |
      1. 对照 references/ 中对应组件的参数说明
      2. 检查 prjId 是否正确配置
      3. 确认 taskId / waypointId 等业务参数存在

  - code: 6000
    name: MAP_LOAD_ERROR
    layer: map
    cause: 地图资源加载失败 — Cesium 资源 404、CDN 不可达
    fix: |
      1. 确认 frontHost 地址正确且 /cesium/ 路径可访问
      2. 检查浏览器网络面板中 cesium 相关请求是否 404
      3. 确认不是内网环境阻断了外部 CDN

  - code: 6001
    name: MAP_RENDER_ERROR
    layer: map
    cause: 地图渲染失败 — WebGL 不支持或 canvas context 丢失
    fix: |
      1. 确认浏览器支持 WebGL（chrome://gpu 检查）
      2. 确认容器 DOM 有显式宽高
      3. 检查是否有 CSS overflow:hidden 裁切了地图区域
    related_constraints:
      - container-must-have-size

  - code: 6002
    name: MAP_INIT_ERROR
    layer: map
    cause: 地图初始化失败 — paas.js 未先加载、或在 FH2.initConfig 之前调用了组件方法
    fix: |
      1. 确认 paas.js <script> 标签在组件 SDK 之前
      2. Vue 模式下确认 ensureFH2Init() await 完成后再调用 loadXxx
      3. 确认 window.FH2 已存在再调 initConfig
    related_constraints:
      - paas-js-load-order
      - vue-ensureFH2Init-pattern

  - code: 7000
    name: UNKNOWN_ERROR
    layer: general
    cause: 未分类错误 — 通常是组件内部异常
    fix: |
      1. 查看浏览器控制台完整堆栈
      2. 尝试最小化复现（去除自定义逻辑，只保留 SDK 调用）
      3. 确认组件版本与 paas.js 版本匹配

backend:
  - code: ERROR_INIT_FAILED
    layer: sdk
    cause: SDK initialize 失败 — 配置参数错误（serverAddress/accessToken）或服务端不可达
    fix: |
      1. 检查 FlightHubSdkConfig 中 serverAddress 是否正确（含协议和端口）
      2. 确认 accessToken 有效且未过期
      3. 确认网络连通性（telnet/curl 测试）
      4. 检查 SDK 日志中的详细错误信息

  - code: ERROR_INVALID_STATE
    layer: sdk
    cause: SDK 状态不正确 — 未初始化就调用方法、或飞控指令前未获取控制权
    fix: |
      1. 确认 initialize() 已成功返回（回调 error_code == 0）
      2. 飞控指令前确认 acquireFlightControlAuthority() 成功
      3. 检查是否有其他客户端抢占了控制权
    related_constraints:
      - flight-control-authority

  - code: ERROR_DEVICE_NOT_FOUND
    layer: sdk
    cause: 设备不存在 — getDroneInstance(sn) / getDockInstance(sn) 返回 null
    fix: |
      1. 确认设备 SN 拼写正确（大小写敏感）
      2. 确认设备当前在线（通过 DeviceStatusService 检查）
      3. 确认 SDK 初始化时的 workspace 包含该设备
    related_constraints:
      - null-guard-device-instance

  - code: ERROR_CALLBACK_TIMEOUT
    layer: sdk
    cause: SDK 回调超时 — 操作未在预期时间内返回结果
    fix: |
      1. 检查网络连接质量（RTT、丢包率）
      2. 确认设备端已响应（通过设备管理界面确认）
      3. 适当增大超时时间（SdkCallbackBridge.await 参数）
      4. 排查是否有并发操作阻塞了 SDK 线程

  - code: NPE
    layer: java
    cause: NullPointerException — 通常是未检查 SDK 返回值或回调 data 字段
    fix: |
      1. 对 getDroneInstance/getDockInstance 返回值做 null 检查
      2. 对回调 data 在 error_code != 0 时做 null 检查
      3. 对 Optional 链路中的可能为空节点做 guard
    related_constraints:
      - null-guard-device-instance
      - error-code-check

  - code: ERROR_LISTEN_FAILED
    layer: sdk
    cause: 监听注册失败 — listen* 返回负数 ID
    fix: |
      1. 确认 SDK 已完成初始化
      2. 确认没有重复注册同类型的监听
      3. 检查 SDK 日志中的错误描述
    related_constraints:
      - listen-cancel-pairing

# ==============================================================================
# 设备端错误码（6 位数字，来自 DJI Cloud API 官方文档）
# ==============================================================================
# 来源: https://developer.dji.com/doc/cloud-api-tutorial/en/error-code.html
# 同步自: https://github.com/dji-sdk/Cloud-API-Doc/blob/master/docs/cn/71.error-code.md
# 总计: 443 个错误码, 19 个模块
#
# 编码规则: ABCDEF
#   A = 来源: 3/5=设备端(机场/飞行器), 4/6=DJI Pilot 2
#   BC = 功能模块编号
#   DEF = 模块内自定义错误序号
#
# 使用方法:
#   1. 收到错误码后, 取前 3 位确定模块
#   2. 在对应模块 codes 列表中查找完整 6 位码
#   3. desc 字段为中文描述, 通常已包含修复建议
# ==============================================================================

