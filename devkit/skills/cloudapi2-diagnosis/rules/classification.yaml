# 静态判级决策表（人读版）
#
# 本文件是 `scripts/diag.sh` 中 `classify_code` / `classify` 的**人读映射**。
# 被执行的是 bash case（diag.sh 是程序），本 YAML 不参与运行时；
# 二者的语义必须一致——改判级逻辑先改 diag.sh，再同步本表。
#
# 与 `智能诊断体系` 文档族的关系：
# - 本表是 `智能诊断_03 ISV侧设计.md` §3.4「推理控制契约」段二（确定性规则判级器）的**离线本地版**
# - 判级只消费「证据」枚举（命中项 / 缺失项），不消费自由文本——见 SKILL.md 第三章不变量 2
# - 这是私有化「数据不出网」场景的显式降级口径（见 `智能诊断_12` §五），
#   模型判级、动态知识检索仍只在 `fh-diag-server`，本表永远不会成为服务端判级的替身

version: 0.1.0
scope: 私有化 / 数据不出网 / 本地闭环（增强通道外均为本表范围）

# ------------------------------------------------------------
# 1. 输入（classify 所见）
# ------------------------------------------------------------
# 判级器只读取两样东西，均来自 `diag.sh collect` 产出的证据包：
#   - 命中项：证据包 sdk_log 段里提取到的 ERROR_* / NPE token（随包词典命中与否）
#   - 缺失项：证据包关键分组（env / sdk_log）是否为空
# 环境/磁盘/网络/进程段里的 PID、端口、inode 等数字**不是错误码**，不进入判级。

# ------------------------------------------------------------
# 2. 四分支决策表（与 §3.4 段二、README §4 语义一致）
# ------------------------------------------------------------
classification:
  # 命中词典 + 词典给出「动作为具体可执行修复步骤」 → L0（本脚本 v0.1 只判 L1/L2/L3，
  # L0 需要结论分类启发式，留待开放问题 12 定；v0.1 词典命中一律保守落 L1）
  - level: L0
    condition: 词典命中 且 动作具体到可复制粘贴
    action: 输出可执行动作 + 用户确认已执行（记录层口径见 03 §3.2）
    executable_from: pending # TODO(issue-analyzer): 按 03 开放问题 12 定启发式后放开

  - level: L1
    condition: 词典命中 且 只能给结论与建议
    action: 给结论与建议，引用 error-codes.yaml 的 fix 字段，不主动执行
    note: 白名单条目见 SKILL.md §4。v0.1 词典命中统一落此级，属于保守路由

  - level: L2
    condition: 零命中 或 命中但判定为 SDK/服务端问题
    action: 生成结构化升级包（sanitized 证据摘要），走 ISV 侧既有升级路径
    subcondition:
      - 零命中（词典外错误码）：证据包 cite `ERROR_UNKNOWN_*`
      - 命中但 SDK/服务端问题：需人工复核，本脚本 v0.1 不自动判

  - level: L3
    condition: 零命中 且 关键采集缺失（env 或 sdk_log 为空）
    action: 降级为原始工单 + 现场快照，标注低质量包（03 §3.1 显式区分 L2/L3 的理由）

# ------------------------------------------------------------
# 3. 决策顺序（段二确定性：同一证据包 → 同一级别）
# ------------------------------------------------------------
# 1) 提取证据包中的错误码 token；token 为空且关键分组缺失 → L3
# 2) token 命中随包词典 → 检查分类（v0.1 未解 L0 启发式，统一 L1）
# 3) token 不在词典 → L2
# 4) 升级触发：段一不确定 / 采集失败 / 超限 → 默认升级 L2/L3（见 SKILL.md 不变量 4）

# ------------------------------------------------------------
# 4. 随包词典（dicts/error-codes.yaml）与依赖关系
# ------------------------------------------------------------
# 词典命中是 L1/L0 的唯一准入——词典里没有的错误码一律 L2/L3。
# 词典更新走重申：
#   - 本表不直接改，改的是 error-codes.yaml（词典）+ diag.sh classify_code（执行）。
#   - 语义漂移检测：grep -c 两侧的错误码清单条数，改完必须核对。