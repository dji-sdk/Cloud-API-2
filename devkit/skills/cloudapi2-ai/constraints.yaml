# DJI Cloud API 2 AI 域约束规则
#
# 共享约束见 _shared/constraints-common.yaml（SSOT），本文件只定义 AI 域特有规则。
# 共享约束包括：initialize-check, error-code-check, listen-cancel-pairing,
#   null-guard-instances, thread-safety, resource-cleanup
#
# level: critical — 违反必导致功能失败
# level: warning  — 违反可能导致问题但不一定立即失败

# extends: _shared/constraints-common.yaml

# ============================================================
# 模块归属与 null 语义
# ============================================================

- id: module-ownership
  rule: AIBoxModule / OnboardAiModule 只能通过 drone.getAIBoxModule() / drone.getOnboardAiModule() 获取；AIInsideManageModule / AiAlertModule 只能通过 workspace.getAIInsideManageModule() / workspace.getAIAlertModule() 获取，四个模块不能互换取用对象
  violation: 生成 drone.getAIInsideManageModule() / workspace.getAIBoxModule() 等不存在的方法，编译失败
  level: critical

- id: ai-box-getter-silent-null
  rule: Drone.getAIBoxModule() 在底层模块为 null 时静默返回 null、不记 Logger.error（与另外三个 getter 行为相反），业务层必须显式判空，不能依赖日志排查
  violation: 误以为能从日志定位 AI Box 相关调用全部失败的原因，实际日志里什么都没有
  level: warning

- id: other-getters-log-on-null
  rule: drone.getOnboardAiModule()、workspace.getAIInsideManageModule()、workspace.getAIAlertModule() 在底层为 null（或构造异常）时都会 Logger.error 并返回 null，调用前仍需判空
  violation: NullPointerException
  level: critical

# ============================================================
# 命名不规则（源码级事实，禁止按常规驼峰"修正"）
# ============================================================

- id: onboard-ai-pascal-case-methods
  rule: OnboardAiModule 的 AIIdentifySet / AIIdentifyFilterSet / AIIdentifyScoreSet / AIIdentifyScoreModeSet / AIIdentifyScoreReset / AIModelSelect / DrcAISpotlightZoomSet/Select/Confirm/Stop/Track / DrcAIAlarmStart/Stop / DrcAIModelsConfig 共 14 个方法名首字母大写，必须原样调用，不得"修正"为小写驼峰
  violation: 编译失败（方法不存在）
  level: critical

- id: drone-sn-list-capitalization
  rule: OperateAIInsideModelParam 的字段是 droneSNList（SN 全大写），访问器是 getDroneSNList()/setDroneSNList()，不是常规驼峰的 droneSnList
  violation: 编译失败
  level: critical

- id: enable-target-alert-getter
  rule: PostAiAlertDeviceSettingParam 的 enableTargetAlert 是 boolean 字段，getter 是 isEnableTargetAlert()，不是 getEnableTargetAlert()
  violation: 编译失败
  level: critical

- id: flight-id-singular-list
  rule: GetAiAlertRecordsParam.flightId 是 List<String> 类型但字段名是单数 flightId（不是 flightIds/flightIdList）；targetType 同样是 List<Integer> 但字段名单数
  violation: 编译失败，或凭常规命名猜测拼错方法名
  level: critical

# ============================================================
# 参数体系不统一（AI 识别 vs DRC Spotlight/Alarm）
# ============================================================

- id: ai-identify-generated-snake-case
  rule: AIIdentifySet / AIIdentifyFilterSet / AIIdentifyScoreSet / AIIdentifyScoreModeSet / AIIdentifyScoreReset / AIModelSelect 的入参类型来自 com.dji.flighthubsdk.generated 包，字段访问器是 snake_case（如 setLight_type/setScore_mode），不是 camelCase bean
  violation: 编译失败，或编造一个不存在的 camelCase bean 类
  level: critical

- id: drc-spotlight-alarm-bean-params
  rule: DrcAISpotlightZoomSelect / DrcAIAlarmStart / DrcAIModelsConfig 的入参类型是 com.dji.flighthubsdk.bean 包下的 camelCase *Params（内部经 FlightHubSdkConvert 转 native），与 AI 识别组的 generated 包 snake_case 参数是两套不同体系，不能混用
  violation: 字段名或包路径写错导致编译失败
  level: critical

- id: ai-identify-score-reset-index-fixed
  rule: AIIdentifyScoreReset 的 index 字段官方约定固定填 0，不是设备/云台索引
  violation: 传入非 0 值导致请求被拒绝或行为不符合预期
  level: warning

- id: light-type-enum-values
  rule: AIIdentifyScoreReset 等方法的 light_type 取值含义固定：1=广角，2=变焦，3=红外
  violation: 取值记反导致控制错误的镜头
  level: warning

- id: listen-callback-no-convert
  rule: listenAIDataInfo / listenDrcAIAlarmState 的回调直接把 generated.AiDataInfo / generated.AiAlarmStateInfo 原样传给 callback，没有经过 FlightHubSdkConvert 转换，不要假设回调里拿到的是 bean 包装类型
  violation: 按 bean 类型编写回调处理逻辑导致类型不匹配，编译失败
  level: warning

# ============================================================
# 传输链路与前置条件
# ============================================================

- id: onboard-ai-drc-prerequisite
  rule: OnboardAiModule 所有 action 方法（除 listen/cancelListen 订阅）都走 DRC，调用前必须先 drone.getDrcModule().connectDrcLink(...) 并在成功分支内下发
  violation: 指令无明显错误但设备不响应
  level: critical

- id: ai-alert-no-drc-dependency
  rule: AiAlertModule 全部 6 个业务方法走纯 HTTP，HTTP 路径虽带 /drc/paas/v2/ 前缀但不依赖 DRC 链路，不需要 connectDrcLink 前置校验
  violation: 生成多余的 DRC 建链代码，或误判为 DRC 链路未建立导致调用失败
  level: warning

- id: ai-inside-no-drc-dependency
  rule: AIInsideManageModule 全部方法走纯 HTTP，不依赖 DRC 链路
  violation: 生成多余的 DRC 建链代码
  level: warning

# ============================================================
# 回调签名
# ============================================================

- id: ai-box-callback-shape
  rule: AIBoxModule 全部 10 个方法的回调都是 (FlightHubError error, ResultBean result) 两参数、error-first，没有无参或单参回调
  violation: 虚构单参回调或漏写 result 参数，编译失败
  level: critical

- id: ai-inside-delete-single-arg
  rule: AIInsideManageModule.deleteAIInsideAlgorithm 的回调是单参数 FlightHubCallback.DeleteAIInsideAlgorithmCallback（只有 FlightHubError，没有 result），是本模块唯一的裸错误回调
  violation: 给该回调编造不存在的 result 参数，编译失败
  level: critical

- id: ai-alert-callback-shape
  rule: AiAlertModule 全部 6 个业务方法回调都是 (FlightHubError, ResultBean) 两参数，没有裸错误回调
  violation: 编译失败
  level: critical

- id: onboard-ai-dual-callback-signature
  rule: OnboardAiModule 的 ResultCallback（AI 识别组）与 ResultCallbackWithError（Spotlight/Alarm 组）公开方法签名完全相同（均为单参数 onResult(FlightHubError error)），内部构造 FlightHubError 的代码路径不同属实现细节，业务代码无需区分对待
  violation: 误以为两者签名不同而编造额外参数
  level: warning

# ============================================================
# 偏离标准模式的方法
# ============================================================

- id: ai-box-raw-string-params
  rule: AIBoxModule.fetchAIBoxInfo（单个 String deviceSn）与 uploadAIBoxFile（3 个 String：filePath/deviceSn/boxSn）不走 bean→native 转换，直接传基础类型；不要为这两个方法编造 bean 参数类
  violation: 编译失败
  level: critical

- id: ai-box-progress-is-polling
  rule: AIBoxModule 的 fetchAppListProgress / exportFileProgress / installAppProgress 是一次性 HTTP 查询，不是 listen/cancel 订阅，需要调用方自行实现轮询循环
  violation: 把一次性查询当作长连接订阅处理，或寻找不存在的 cancel 方法
  level: warning

- id: ai-inside-upload-two-paths
  rule: AIInsideManageModule 的私有化算法上传有两条路径：一步到位的 uploadAlgorithmFile（内部串联 create→MinIO PUT→file-upload）与手动三步（createAIInsideAlgorithm + 自行 PUT 到 MinIO + fileUploadAIInsideAlgorithm）；手动三步的第 2 步 SDK 不提供方法，需调用方自行实现 HTTP PUT
  violation: 误以为 SDK 提供直传 MinIO 的方法（不存在），或在已用 uploadAlgorithmFile 的情况下又手动调用 create/file-upload 导致重复上传
  level: warning

- id: upload-algorithm-result-signed-id-nested
  rule: uploadAlgorithmFile 的回调结果 UploadAIInsideAlgorithmFileResult 顶层只有 objectKey/objectUrl/etag/detail 四个字段，signedId 在 detail（AIInsideAlgorithmDetail）下，必须用 result.getDetail().getSignedId() 取值
  violation: 编造不存在的 result.getSignedId()，或因找不到访问器而写占位 null 导致后续 operateAIInsideModel 拿不到真实 signedId
  level: critical

- id: ai-alert-algorithm-setting-is-upsert
  rule: AiAlertModule.postAlgorithmSetting 是 Upsert 语义（存在则更新、不存在则创建），没有单独的 create/update 两个方法
  violation: 寻找不存在的 updateAlgorithmSetting 方法
  level: warning

- id: ai-alert-flights-vs-records
  rule: getAiAlertFlights 返回按飞行架次聚合的统计（是否产生过告警），getAiAlertRecords 才是具体告警明细条目；需先用 flights 查到 flight_id 再查 records，不能从 flights 结果直接读取告警明细字段
  violation: 误以为单次调用 getAiAlertFlights 即可拿到告警详情
  level: warning

# ============================================================
# 生命周期
# ============================================================

- id: destroy-lifecycle-cleanup
  rule: AIInsideManageModule.destroy() 与 AiAlertModule.destroy() 应在 Workspace 销毁时调用，用于清空内部 ConcurrentHashMap 中未完成的回调强引用，防止悬挂引用阻止 GC
  violation: 长时间运行的服务积累悬挂引用，内存泄漏
  level: warning
