server:
  port: ${FH_SSE_PORT:8080}

spring:
  application:
    name: flighthub-mcp-server
  main:
    banner-mode: off
  webflux:
    # 对外 HTTP 接口统一前置到 /pf-devkit/ai-plugin/mcp 命名空间
    base-path: /pf-devkit/ai-plugin/mcp

# FlightHub SDK Configuration
flighthub:
  server:
    # FlightHub 服务器地址。默认 http://localhost（同机部署场景）；连接失败时通过 elicitation 引导用户输入
    address: ${FH_SERVER_ADDRESS:http://localhost}
    port: ${FH_SERVER_PORT:30812}
  auth:
    access-token: ${FH_ACCESS_TOKEN:}
    workspace-uuid: ${FH_WORKSPACE_UUID:}
    http-auth-key: ${FH_HTTP_AUTH_KEY:}
    http-auth-value: ${FH_HTTP_AUTH_VALUE:}
  security:
    # 默认 L2（允许飞行控制）；L3 紧急停机需显式配置
    max-level: ${FH_MAX_SECURITY_LEVEL:2}
    # L3 运营商二次鉴权 Token：未配置时 L3 操作一律拒绝执行
    operator-token: ${FH_OPERATOR_TOKEN:}
    session-timeout: ${FH_SESSION_TIMEOUT:1800}
    session-check-interval: 30000
  failsafe:
    on-crash: ${FH_FAILSAFE_ON_CRASH:return_home}
    disconnect-timeout: ${FH_FAILSAFE_DISCONNECT_TIMEOUT:60}
  audit:
    enabled: ${FH_AUDIT_ENABLED:true}
    endpoint: ${FH_AUDIT_ENDPOINT:}
    retention-days: ${FH_AUDIT_RETENTION_DAYS:30}
  idempotency:
    enabled: ${FH_IDEMPOTENCY_ENABLED:true}
    ttl-seconds: ${FH_IDEMPOTENCY_TTL:300}
    max-size: ${FH_IDEMPOTENCY_MAX_SIZE:10000}
  transport:
    mode: ${FH_TRANSPORT:stdio}
    sse-port: ${FH_SSE_PORT:8080}
    # SSE 鉴权 token：留空时 SSE 模式启动会被 StartupAuthValidator 拒绝
    sse-auth-token: ${FH_SSE_AUTH_TOKEN:}
    heartbeat-interval-ms: ${FH_HEARTBEAT_INTERVAL:30000}
    heartbeat-timeout-seconds: ${FH_HEARTBEAT_TIMEOUT:300}
    grace-period-seconds: ${FH_GRACE_PERIOD:60}
    grace-warning-before-seconds: ${FH_GRACE_WARNING_BEFORE:10}
  cockpit:
    # 可选：留空时不返回 cockpit 链接（不再硬编码内网地址）
    url: ${FH_COCKPIT_URL:}

# pf-device-simulator-service Configuration (Sim* tools, 独立于 flighthub.* 鉴权体系)
sim:
  base-url: ${FH_SIM_BASE_URL:http://localhost:8000}
  username: ${FH_SIM_USERNAME:admin}
  # F-02 整改：无默认密码 fallback。未配置 FH_SIM_PASSWORD 时 Sim* 工具拒绝调用（fail-fast），
  # 凭据须与模拟器 config.yaml 的 auth.default_password 一致。
  password: ${FH_SIM_PASSWORD:}

logging:
  level:
    com.dji.flighthub.mcp: INFO
    io.modelcontextprotocol: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
