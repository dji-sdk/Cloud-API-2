# 前端敏感运行时变量 Secret（集成商按需填写，未使用的项可保留为空串）
# 说明：
#   - docker-entrypoint.sh 用 VITE_FH2_USER_TOKEN 在 nginx 侧注入 FH2 网关鉴权头与
#     ws 子协议，凭据只存在于容器环境，不写入 config.js / 浏览器 / git。
#   - 未配置 VITE_FH2_USER_TOKEN 时占位符替换为空串，nginx 原样透传浏览器请求（无回归）。
#   - stringData 自动 base64 编码，无需手工加密。
apiVersion: v1
kind: Secret
metadata:
  name: skeleton-frontend-secret
  namespace: fh-skeleton
type: Opaque
stringData:
  # FH2 身份 JWT（与后端 FH_SKELETON_SDK_TOKEN 用途不同，取自 FH2 门户登录态）
  VITE_FH2_USER_TOKEN: ""
  # 地图 Key（写入 config.js 供前端地图组件使用）
  VITE_BING_KEY: ""
  VITE_TIANDITU_KEY: ""
