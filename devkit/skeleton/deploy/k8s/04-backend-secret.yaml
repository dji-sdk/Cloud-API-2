# 后端敏感环境变量 Secret（ISV 必填：将 <REPLACE_ME> 替换为强随机值）
# 生成示例：
#   FH_JWT_SECRET=$(openssl rand -hex 32)
#   FH_SKELETON_SDK_TOKEN=<从 FlightHub 控制台获取>
#   FH_CHAT_MCP_AUTH_TOKEN=$(openssl rand -hex 32)
# 说明：stringData 自动 base64 编码，无需手工加密。
apiVersion: v1
kind: Secret
metadata:
  name: skeleton-backend-secret
  namespace: fh-skeleton
type: Opaque
stringData:
  FH_JWT_SECRET: <REPLACE_ME>
  FH_DB_PASSWORD: <REPLACE_ME>
  FH_SKELETON_SDK_TOKEN: <REPLACE_ME>
  FH_CHAT_MCP_AUTH_TOKEN: <OPTIONAL_REPLACE_ME>
