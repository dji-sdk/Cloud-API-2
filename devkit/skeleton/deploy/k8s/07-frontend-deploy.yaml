# 前端 Nginx Deployment + Service
# 前置：已将前端镜像推送到 <REGISTRY>（构建命令见 docs/部署指南.md §5.1）
# 说明：
#   - 容器入口 docker-entrypoint.sh 启动时生成 config.js（运行时配置注入）
#   - 反向代理 /pf-devkit/ai-plugin/skeleton/ → http://skeleton-backend:8080
#     （nginx.conf 内 proxy_pass 使用服务名 skeleton，K8s 下映射到 Service 名）
apiVersion: v1
kind: Service
metadata:
  name: skeleton-frontend
  namespace: fh-skeleton
  labels:
    app: skeleton-frontend
spec:
  type: ClusterIP
  selector:
    app: skeleton-frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skeleton-frontend
  namespace: fh-skeleton
  labels:
    app: skeleton-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: skeleton-frontend
  template:
    metadata:
      labels:
        app: skeleton-frontend
    spec:
      containers:
        - name: nginx
          image: <REGISTRY>/paas-sdk-devkit/skeleton-ui:<TAG>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: skeleton-frontend-config
            # 敏感项（FH2_USER_TOKEN / 地图 Key）单独走 Secret；missing 时用可选引用避免 Pod 起不来
            - secretRef:
                name: skeleton-frontend-secret
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
