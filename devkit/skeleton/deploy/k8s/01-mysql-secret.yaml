# MySQL 凭证 Secret（ISV 必填：将 <REPLACE_ME> 替换为强随机值）
# 生成示例：
#   MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)
#   FH_DB_PASSWORD=$(openssl rand -hex 24)
# 应用方式：kubectl apply -f 01-mysql-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: fh-skeleton
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: <REPLACE_ME>
  MYSQL_PASSWORD: <REPLACE_ME>
  # MYSQL_USER 供后端使用；MYSQL_DATABASE 由官方镜像自动建库
  MYSQL_USER: fh_skeleton
  MYSQL_DATABASE: fh_skeleton
