# ============================================================================
# FH Skeleton 前端 nginx 站点配置（普通机器部署）
# 安装：
#   sudo cp skeleton/deploy/skeleton-ui.conf /etc/nginx/conf.d/skeleton-ui.conf
#   sudo nginx -t && sudo systemctl reload nginx
# 说明：
#   - 前端构建产物 dist/ 拷贝到 /usr/share/nginx/html/skeleton-ui
#   - 后端监听 127.0.0.1:8080（由 skeleton.service 启动）
#   - 与 Docker 形态的 web/nginx.conf 等效；proxy_pass 指向本机回环
# ============================================================================
map $request_uri $sanitized_uri {
    default $request_uri;
    "~(.*token=)[^&]*(.*)" "$1***$2";
}

log_format sanitized '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $sanitized_uri $server_protocol" '
                     '$status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/skeleton-ui;
    access_log /var/log/nginx/access.log sanitized;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Vue Router history 模式 SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端（context-path 已含 /pf-devkit/ai-plugin/skeleton）
    location /pf-devkit/ai-plugin/skeleton/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
        proxy_buffering       off;
        proxy_cache           off;
        proxy_set_header      Connection '';
        proxy_http_version    1.1;
        chunked_transfer_encoding off;
    }
}
