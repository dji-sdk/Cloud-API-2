# ── 日志脱敏 ──────────────────────────────────────────────
# EventSource 无法自定义请求头，SSE 鉴权回退到 ?token=<JWT>（见 useTerra.ts /
# JwtAuthenticationProvider）。默认 combined 日志格式会记录完整 URI，导致 JWT
# 明文落入 access_log。此处用 log_substring 在写入前把 query 里的 token 值替换
# 为 ***，仅保留键名，便于排查又避免凭据泄露。
map $request_uri $sanitized_uri {
    default $request_uri;
    # 捕获 token= 前缀与值后剩余 query，把凭据值替换为 ***（兼容 access_token 等含 token= 子串的参数）
    "~(.*token=)[^&]*(.*)" "$1***$2";
}

log_format sanitized '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $sanitized_uri $server_protocol" '
                     '$status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

# WebSocket 升级映射：有 Upgrade 头时 Connection=upgrade，否则置空（供 /fh2-gw/ wss 反代用）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# FH2 通知 ws 鉴权子协议的服务端注入值：仅对 WebSocket 升级请求生效，HTTP 请求为空。
# FH2 通知服务不收 header/query/cookie，而是把凭据编进 Sec-WebSocket-Protocol 的
# auth.<base64url("X-User-Token=<JWT>;user_id=<租户>")> 子协议项（浏览器 ws 唯一能带凭据的方式）。
# 但 skeleton 浏览器里 localStorage['x-user-token'] 是骨架自身后端 JWT（FH2 不认），SDK 据此编出的
# 子协议会被通知服务 401。故由反代用正确的 FH2 JWT 重新编码覆盖；服务端只回显 v1.notify，浏览器
# 握手透明通过。占位符由 docker-entrypoint.sh 按 VITE_FH2_USER_TOKEN 替换，未配置时为空（原样透传）。
map $http_upgrade $fh2_ws_auth_proto {
    default "";
    websocket "__FH2_WS_SUBPROTO_VALUE__";
}

server {
    # 仅监听明文 8080：TLS 由上游统一终止，本容器不直接提供 HTTPS。
    # 340 / O4 组网无人机(M5TD) 的 H265 直播依赖 WebCodecs(Web Worker 内 VideoDecoder)，
    # 而 WebCodecs 要求 secure context（HTTPS 或 localhost）。该 secure context 由部署侧提供：
    #   - k8s：ingress 配置 TLS（见 deploy/k8s/08-ingress.yaml 的 tls 段与 tls-secret）
    #   - docker compose：fh-ssl 边车在 ${HTTPS_PORT:-8083} 终止 TLS 并反代本容器 8080
    #     （见 deploy-compose.yml 的 fh-ssl profile 与 deploy-ssl.conf）
    # 此处不再内置 8443 自签监听：镜像内未生成证书，nginx -t 会因 ssl_certificate 文件缺失而失败，
    # 导致容器 CrashLoopBackOff；且 8443 与 drtc-traefik 占用端口冲突（见 deploy.env.example）。
    listen 8080;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log sanitized;

    # ── 安全响应头 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 仅放行 microphone（前端语音输入 useVoiceInput.ts 需要）；camera/geolocation 继续显式禁用
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    # CSP 暂时禁用 — Cesium CDN Worker 的 importScripts 与多个 CSP 指令冲突，
    # 需独立 MR 逐条调试（script-src/worker-src/child-src 交互复杂）
    # add_header Content-Security-Policy "..." always;

    # ── 缓存策略 ────────────────────────────────────────────────
    # config.js 是容器启动时由 docker-entrypoint.sh 从环境变量重新生成的运行时配置，
    # 每次改 deploy.env 并重启容器后内容都会变，但文件名不变。若不给缓存头，浏览器按
    # 启发式规则把旧版本长期缓存，就会出现「容器里 config.js 明明有值、页面仍报
    # FH2_ADDRESS 未配置」的假故障。这里强制每次重新校验，
    # 未变化时 nginx 回 304，变化时取新内容，避免用户手动清缓存。
    # 用 expires 而非 add_header：add_header 会让本 location 不再继承 server 级安全响应头。
    location = /config.js {
        expires -1;
        try_files $uri =404;
    }

    # index.html 不含 hash，升级后会指向新的资源文件名，同样必须走校验而不是长期缓存。
    location = /index.html {
        expires -1;
    }

    # Vite 产物文件名带内容 hash，内容变则文件名变，可放心长缓存。
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Vue Router history 模式 SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── FH2 同源反代（规避 CORS）──────────────────────────────
    # 浏览器只与本源（骨架 nginx）通信，由 nginx 代理到 FH2，避免 FH2 无 CORS 头导致的
    # wasm/XHR/wss 跨域拦截。上游地址在容器启动时由 docker-entrypoint.sh 按环境变量 sed 注入。
    #
    # /fh2-assets/ → FH2:443 的根路径：承载 paas.js 及其 webpack 懒加载 chunk
    # （/Cesium.js、/MineDecoder.js、/mine-decoder/MineDecoder.wasm、/paasjs-demo/* 等）。
    # paas.js 以自身 <script fh2> 的 src 推导 publicPath，故单前缀即可覆盖全部子资源。
    location /fh2-assets/ {
        proxy_pass            __FH2_ASSET_UPSTREAM__/;
        # 上游 TLS 校验策略：默认 on（fail-closed，安全审计 CICD-09）；现场自签名证书需显式设
        # FH2_PROXY_SSL_VERIFY=off，必要时再用 FH2_PROXY_SSL_CA 指定内部 CA（未指定时用镜像内置
        # 系统信任库）。占位符由 docker-entrypoint.sh 注入；verify=on 时必定同时写入
        # trusted_certificate，否则 nginx 拒绝启动。
        proxy_ssl_verify      __FH2_PROXY_SSL_VERIFY__;
        __FH2_PROXY_SSL_TRUSTED_CA__
        proxy_ssl_server_name on;
        proxy_set_header      Host $proxy_host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }

    # /drtc-<ver>/ → FH2:443 的根路径：DRTC 直播引擎的 Web Worker 及其资源。
    # 340 / O4 组网无人机(M5TD)直播走 DRTC：引擎 sdk.js 经 /fh2-assets/drtc-<ver>/sdk.js 加载成功后，
    # 其内部以站点根绝对路径 new Worker('/drtc-<ver>/sdk_worker.js') 拉起解码 Worker —— 该路径硬编码为
    # 门户根，不跟随 sdk.js 自身的 /fh2-assets/ 前缀。骨架根路径无此文件 → 命中下方 SPA fallback 返回
    # index.html（Content-Type: text/html）→ module worker 的严格 MIME 检查拒绝非 JS 类型 → Worker 起不来
    # → DRTC 引擎 init 后半段中断 → 不建房 → 永不 postMessage joinRoom → exchange/token 永不触发 → 直播黑屏。
    # 原生门户 drtc 资源本就挂在门户根 /drtc-<ver>/，故无此问题。此处把 /drtc- 前缀原样反代到门户根
    # （与 /fh2-assets/ 同一 FH2:443 上游），worker 即同源 200 取到 application/javascript，解码链恢复。
    # 用 ^~ 修饰符确保前缀匹配优先于潜在正则 location；proxy_pass 不带 URI/尾斜杠，原样透传 /drtc-<ver>/... 到门户根。
    location ^~ /drtc- {
        proxy_pass            __FH2_ASSET_UPSTREAM__;
        proxy_ssl_verify      __FH2_PROXY_SSL_VERIFY__;
        __FH2_PROXY_SSL_TRUSTED_CA__
        proxy_ssl_server_name on;
        proxy_set_header      Host $proxy_host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }

    # /<name>-app/ → FH2:443 的根路径：qiankun 子应用（cockpit 由多个微前端拼装）。
    # FH2 驾驶舱用 qiankun 加载子应用，入口 HTML/JS 从门户根路径按绝对路径取：
    # /project-app/、/cockpit-app/、/map-app/、/real-time-app/、/wayline-app/、/media-app/、
    # /organization-app/ 等。这些绝对路径不走 paas.js 的 publicPath（故 /fh2-assets/ 前缀覆盖不到），
    # 若落到下方 SPA fallback 会返回 index.html（HTML），import-html-entry 执行入口脚本即抛错 → 黑窗。
    # 用正则匹配 FH2 的 "<名>-app/" 子应用命名约定统一反代到门户，避免硬编码子应用清单随 FH2 版本过期。
    # 骨架自身 SPA 路由（/cockpit、/devices、/wayline…）均无 -app 后缀，/fh2-assets/ 与 /fh2-gw/ 亦不匹配，
    # 骨架 Vite 产物在 /assets/，故无冲突。正则 location 的 proxy_pass 不能带 URI，原样透传请求路径到门户根。
    location ~ ^/[a-z0-9-]+-app(/|$) {
        proxy_pass            __FH2_ASSET_UPSTREAM__;
        proxy_ssl_verify      __FH2_PROXY_SSL_VERIFY__;
        __FH2_PROXY_SSL_TRUSTED_CA__
        proxy_ssl_server_name on;
        proxy_set_header      Host $proxy_host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
    }

    # /fh2-gw/ → FH2:30812 的根路径：SDK 后端 API（/gateway、/openapi）+ wss 通知推送。
    # 透传 Upgrade/Connection 以支持 WebSocket；关闭 buffering 以支持长连接/流式。
    location /fh2-gw/ {
        proxy_pass            __FH2_API_UPSTREAM__/;
        proxy_ssl_verify      __FH2_PROXY_SSL_VERIFY__;
        __FH2_PROXY_SSL_TRUSTED_CA__
        proxy_ssl_server_name on;
        proxy_set_header      Host $proxy_host;
        proxy_set_header      X-Real-IP $remote_addr;
        # FH2 网关 isv-webhook-auth 鉴权头的服务端注入点。
        # 网关读名为 auth_keys 的声明头（值为分号分隔的头名清单），再按清单读取各凭据头交 webhook 校验。
        # 完整三件套：auth_keys: X-User-Token;user_id / x-user-token: <FH2 身份 JWT> / user_id: <租户>。
        # 浏览器此处 x-user-token 携带的是骨架自身后端 JWT（FH2 不认），且 auth_keys/user_id 带下划线会被
        # 默认 underscores_in_headers off 丢弃 —— 故统一由反代用 proxy_set_header 覆盖注入（不受下划线丢弃
        # 影响）。token 仅存于容器环境，不入 config.js / 浏览器 / git。由 docker-entrypoint.sh 按
        # VITE_FH2_USER_TOKEN 注入；未配置时占位符替换为空串，保持浏览器原值透传，无回归。
        __FH2_USER_TOKEN_HEADER__
        # FH2 通知 ws 鉴权子协议覆盖：仅 WebSocket 升级请求有值（见顶部 $fh2_ws_auth_proto map），
        # 用正确的 FH2 JWT 重编 Sec-WebSocket-Protocol，替换浏览器 SDK 用错误 token 编出的子协议。
        # HTTP 请求该变量为空，proxy_set_header 空值即不下发该头，不影响普通 API 请求。
        __FH2_WS_SUBPROTO_HEADER__
        proxy_http_version    1.1;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_set_header      Connection $connection_upgrade;
        proxy_buffering       off;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # 代理到 Spring Boot（Docker Compose 服务名 skeleton）
    # 后端 context-path=/pf-devkit/ai-plugin/skeleton，api 与 mock 均含此前缀，单 location 覆盖
    location /pf-devkit/ai-plugin/skeleton/ {
        proxy_pass       http://skeleton:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # chatbot 多轮 tool call 链路耗时较长，需放宽超时
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;

        # SSE 流式响应支持（chat stream / terra events）
        proxy_buffering       off;
        proxy_cache           off;
        proxy_set_header      Connection '';
        proxy_http_version    1.1;
        chunked_transfer_encoding off;
    }
}
