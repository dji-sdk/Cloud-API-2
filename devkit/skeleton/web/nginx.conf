# ── 日志脱敏 ──────────────────────────────────────────────
# EventSource 无法自定义请求头，SSE 鉴权回退到 ?token=<JWT>（见 useTerra.ts /
# JwtAuthenticationProvider）。默认 combined 日志格式会记录完整 URI，导致 JWT
# 明文落入 access_log。此处用 log_substring 在写入前把 query 里的 token 值替换
# 为 ***，仅保留键名，便于排查又避免凭据泄露。
map $request_uri $sanitized_uri {
    default $request_uri;
    # 捕获 token= 前缀与值后剩余 query，把凭据值替换为 ***（兼容 access_token 等含 token= 子串的参数）
    "~(.*token=)[^&]*(.*)" "$1***$2";
}

log_format sanitized '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $sanitized_uri $server_protocol" '
                     '$status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

server {
    listen 8080;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log sanitized;

    # ── 安全响应头 ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 仅放行 microphone（前端语音输入 useVoiceInput.ts 需要）；camera/geolocation 继续显式禁用
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    # CSP 暂时禁用 — Cesium CDN Worker 的 importScripts 与多个 CSP 指令冲突，
    # 需独立 MR 逐条调试（script-src/worker-src/child-src 交互复杂）
    # add_header Content-Security-Policy "..." always;

    # Vue Router history 模式 SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 代理到 Spring Boot（Docker Compose 服务名 skeleton）
    # 后端 context-path=/pf-devkit/ai-plugin/skeleton，api 与 mock 均含此前缀，单 location 覆盖
    location /pf-devkit/ai-plugin/skeleton/ {
        proxy_pass       http://skeleton:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # chatbot 多轮 tool call 链路耗时较长，需放宽超时
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;

        # SSE 流式响应支持（chat stream / terra events）
        proxy_buffering       off;
        proxy_cache           off;
        proxy_set_header      Connection '';
        proxy_http_version    1.1;
        chunked_transfer_encoding off;
    }
}
