<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-label="Delivery phases">
  <rect width="920" height="320" fill="#f1f5f9" rx="12"/>
