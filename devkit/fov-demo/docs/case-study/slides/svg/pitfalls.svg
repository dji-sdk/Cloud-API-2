<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-label="Top pitfalls">
  <rect width="920" height="340" fill="#fff" rx="12"/>
  <text x="460" y="36" text-anchor="middle" fill="#0f172a" font-size="18" font-weight="700" font-family="PingFang SC, sans-serif">常见问题 Top 6（每条可查文档）</text>
  <g font-family="PingFang SC, sans-serif" font-size="12">
    <rect x="30" y="55" width="420" height="78" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="48" y="78" fill="#b91c1c" font-weight="700">1. SEI bound to DRC</text>
    <text x="48" y="98" fill="#475569">DRC before live - live==null - never subscribe</text>
    <text x="48" y="118" fill="#7c3aed" font-size="11">subscription-lifecycle / SeiOnLiveStart.java</text>
    <rect x="470" y="55" width="420" height="78" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="488" y="78" fill="#b91c1c" font-weight="700">2. UI gated on drcConnected</text>
    <text x="488" y="98" fill="#475569">SEI layers hidden without DRC</text>
    <text x="488" y="118" fill="#7c3aed" font-size="11">scene-matrix - use liveStarted</text>
    <rect x="30" y="145" width="420" height="78" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="48" y="168" fill="#c2410c" font-weight="700">3. Wrong units</text>
    <text x="48" y="188" fill="#475569">wind dm/s, SEI mm, FOV um</text>
    <text x="48" y="208" fill="#7c3aed" font-size="11">units-and-display.md</text>
    <rect x="470" y="145" width="420" height="78" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="488" y="168" fill="#c2410c" font-weight="700">4. SEI roll vs gimbal_roll</text>
    <text x="488" y="188" fill="#475569">NED euler vs joint angles</text>
    <text x="488" y="208" fill="#7c3aed" font-size="11">sei-vs-gimbal-angles.md</text>
    <rect x="30" y="235" width="420" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="48" y="258" fill="#15803d" font-weight="700">5. MQTT laser missing</text>
    <text x="48" y="278" fill="#475569">Use DRC listenCameraMeasureTarget</text>
    <text x="48" y="298" fill="#7c3aed" font-size="11">mqtt-vs-drc-laser.md</text>
    <rect x="470" y="235" width="420" height="78" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="488" y="258" fill="#15803d" font-weight="700">6. FFmpeg transcode drops SEI</text>
    <text x="488" y="278" fill="#475569">WHIP must pass-through H.264</text>
    <text x="488" y="298" fill="#7c3aed" font-size="11">fhsdk-live-whep / faq Q4</text>
