# Flight Hub Java SDK 模块化 Demo —— 资源门控配置
#
# 本工程有自己的 settings.gradle（rootProject.name = 'new-sdk-demo'），是独立的 Gradle root，
# 所以必须自带一份资源配置，否则会用 Gradle 默认值：max-workers = nproc（本机 20）。
#
# ---- 下面这行 org.gradle.jvmargs 与 platform/java/、flight_hub_sdk_demo/ 的必须逐字一致 ----
# Gradle 按 (jvmargs + JDK) 匹配复用 daemon：三处相同 → 三个工程共用一个 daemon；
# 一旦有差异，就会各起一个、各存活 3 小时，逐轮累积吃内存
#（实测曾有 8 个常驻 daemon、合计 3.6G RSS，挤占的正是 C++ 编译要用的内存）。
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Duser.language=zh -Duser.country=CN
# 直接跑 ./gradlew 时的兜底；build.sh 会用 --max-workers 覆盖成本轮定版的并行度。
org.gradle.workers.max=4
org.gradle.parallel=false

# 字符编码设置（与 platform/java/gradle.properties 保持一致）
systemProp.file.encoding=UTF-8
systemProp.user.language=zh
systemProp.user.country=CN
