# Flight Hub Java SDK 版本配置
# 版本号已迁移到 dji_flight_hub_sdk/VERSION (SoT)；settings.gradle 读取后
# 通过 gradle.ext.sdkVersion 分发给各子项目。本文件保留非版本类配置。

# 项目分组
project.group=com.dji

# SDK 元信息（非版本）
sdk.name=Flight Hub SDK
sdk.vendor=DJI

# SWIG版本（用于生成的Java文件）
swig.version=4.3.1

# Java版本
java.version=1.8
java.sourceCompatibility=1.8
java.targetCompatibility=1.8

# 构建信息（build.jdk / build.date 移到运行时求值，避免 gradle.properties 模板变量不解析问题）
build.user=dji-enterprise

# 字符编码设置
# ---- 资源门控（与 flight_hub_sdk_demo/、new_sdk_demo/ 的 gradle.properties 逐字一致）----
# 三个独立 Gradle root 各自会拉起 daemon。Gradle 按 (jvmargs + JDK) 匹配复用 daemon，
# 所以三处这一行必须完全相同，否则三个工程各起一个、各存活 3 小时
# （实测曾累积到 8 个常驻 daemon、合计 3.6G RSS，挤占的正是下一轮 C++ 编译要用的内存）。
# 显式写死 -Xmx/-XX:MaxMetaspaceSize 而不依赖 Gradle 默认注入，也是为了让这行稳定可比对。
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Duser.language=zh -Duser.country=CN
# Gradle 默认 max-workers = nproc（本机 20）。构建脚本会用 --max-workers 覆盖，
# 这里的值是直接跑 ./gradlew 时的兜底。
org.gradle.workers.max=4
org.gradle.parallel=false
systemProp.file.encoding=UTF-8
systemProp.user.language=zh
systemProp.user.country=CN