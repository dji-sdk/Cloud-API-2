rootProject.name = 'flight-hub-java'

// 版本号统一 SoT：从 dji_flight_hub_sdk/VERSION 读；主工程内所有 include 的子项目通过
// gradle.ext.sdkVersion 拿到（形如 "v3.1.0"，保留 "v" 前缀习惯）。
// 独立 Gradle 工程（如 new_sdk_demo）不共享此 gradle.ext，需自己读同一份 VERSION。
def versionFile = file("${rootDir}/../../VERSION")
if (!versionFile.exists()) {
    throw new GradleException("VERSION file not found: ${versionFile.absolutePath}")
}
gradle.ext.sdkVersion = "v${versionFile.text.trim()}"

include 'flight_hub_sdk'
include 'flight_hub_sdk_demo'
// flight_hub_sdk_docs 依赖 Kotlin/Dokka 插件（需访问 Gradle Plugin Portal）。
// 配置阶段只要 include 就会拉插件；CI 机 NAC 拦截外网 HTTPS 时会导致整次 Java 打包失败。
// 打包只编 :flight_hub_sdk，默认不纳入。需要生成文档时：
//   ./gradlew -PincludeDocs=true :flight_hub_sdk_docs:javadoc
if (settings.hasProperty('includeDocs') && settings.includeDocs.toString() == 'true') {
    include 'flight_hub_sdk_docs'
}