name: 💡 需求 / 建议
description: 功能需求、体验改进建议
title: "[需求] "
labels: ["type/enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### 提交前请先确认 🔍
        为帮助你更快定位与解决问题，提交 issue 前请先：
        - 📖 查阅 [项目 README 与文档](https://github.com/dji-sdk/Cloud-API-2#readme)
        - 🔎 搜索 [已有 issue（含已关闭）](https://github.com/dji-sdk/Cloud-API-2/issues?q=is%3Aissue)，确认是否已有相同或类似问题

        很多问题在文档或历史 issue 中已有解答，可以更快得到答复。

  - type: input
    id: company
    attributes:
      label: 企业名称 *
      description: 请填写您的企业完整名称，以便于提供更优质的服务。如果您是独立开发者，可以填写「独立开发者」。
      placeholder: 例如：XX 电力科技有限公司 / 独立开发者
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: Summary *
      description: 一句话概括需求
    validations:
      required: true

  - type: dropdown
    id: problem-scope
    attributes:
      label: 相关模块（选填）
      options:
        - 上云 API 2 底座
        - SDK
        - 前端组件

  - type: input
    id: cloud-version
    attributes:
      label: 上云 API 2 版本号（选填）
      placeholder: 例如：2.3.1

  - type: textarea
    id: description
    attributes:
      label: 需求描述 / 使用场景 / 期望 *
      placeholder: |
        场景：……
        现状痛点：……
        期望能力：……
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 示意（选填）

  - type: dropdown
    id: industry
    attributes:
      label: 行业（选填）
      options:
        - 电力
        - 公安
        - 测绘
        - 其他

  - type: input
    id: industry-other
    attributes:
      label: 行业 — 其他（选填）
      description: 若上面「行业」选择了「其他」，请在此填写
