name: 📌 其他
description: 不属于问题 / 需求 / 咨询的其他反馈
title: "[其他] "
labels: ["type/other"]
body:
  - type: markdown
    attributes:
      value: |
        ### 提交前请先确认 🔍
        为帮助你更快定位与解决问题，提交 issue 前请先：
        - 📖 查阅 [项目 README 与文档](https://github.com/dji-sdk/Cloud-API-2#readme)
        - 🔎 搜索 [已有 issue（含已关闭）](https://github.com/dji-sdk/Cloud-API-2/issues?q=is%3Aissue)，确认是否已有相同或类似问题

        很多问题在文档或历史 issue 中已有解答，可以更快得到答复。

  - type: input
    id: company
    attributes:
      label: 企业名称 *
      description: 请填写您的企业完整名称，以便于提供更优质的服务。如果您是独立开发者，可以填写「独立开发者」。
      placeholder: 例如：XX 电力科技有限公司 / 独立开发者
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: Summary *
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 详细描述 *
    validations:
      required: true

  - type: dropdown
    id: industry
    attributes:
      label: 行业（选填）
      options:
        - 电力
        - 公安
        - 测绘
        - 其他

  - type: input
    id: industry-other
    attributes:
      label: 行业 — 其他（选填）
      description: 若上面「行业」选择了「其他」，请在此填写
